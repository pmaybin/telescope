# Dev override: hot reload for the API (uvicorn --reload) and the web app (Vite HMR).
# Usage: `make dev` (= docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build).
# Dependency changes (pyproject.toml / package.json) need a rebuild: re-run `make dev`.
services:
  api:
    command:
      - uvicorn
      - telescope.main:app
      - --host=0.0.0.0
      - --port=8000
      - --no-access-log
      - --reload
      - --reload-dir=/app/src
    volumes:
      - ../backend/src:/app/src:ro
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports: !override
      - "${WEB_PORT:-8080}:5173"
    volumes:
      - ../frontend/src:/app/src:ro
      - ../frontend/public:/app/public:ro
      - ../frontend/index.html:/app/index.html:ro
      - ../frontend/vite.config.ts:/app/vite.config.ts:ro
      - ../frontend/tsconfig.json:/app/tsconfig.json:ro
      - ../frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json:ro
