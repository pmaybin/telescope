name: telescope

services:
  lgtm:
    image: grafana/otel-lgtm:0.41.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/telescope.json
    volumes:
      - ./grafana/dashboards/telescope.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/telescope.json:ro
      - ./grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health && test -f /tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ../backend
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-600}
      CACHE_BACKEND: ${CACHE_BACKEND:-memory}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_MODE: ${AUTH_MODE:-dev}
      AUTH_DEV_SECRET: ${AUTH_DEV_SECRET:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-}
      USER_RATE_PER_MIN: ${USER_RATE_PER_MIN:-120}
      USER_RATE_BURST: ${USER_RATE_BURST:-30}
      USER_UPSTREAM_BUDGET: ${USER_UPSTREAM_BUDGET:-100}
      USER_UPSTREAM_WINDOW_S: ${USER_UPSTREAM_WINDOW_S:-600}
      UPSTREAM_RESERVE_FRACTION: ${UPSTREAM_RESERVE_FRACTION:-0.2}
      MAX_CONCURRENT_WALKS: ${MAX_CONCURRENT_WALKS:-2}
      ORG_ALLOWLIST: ${ORG_ALLOWLIST:-}
      COLD_WAIT_MS: ${COLD_WAIT_MS:-1500}
      PREVIEW_MODE: ${PREVIEW_MODE:-first}
      PREWARM_ORGS: ${PREWARM_ORGS:-}
      OTEL_SERVICE_NAME: telescope-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    depends_on:
      lgtm:
        condition: service_healthy

  web:
    build: ../frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  # Optional shared snapshot cache. Enable with `--profile redis` and CACHE_BACKEND=redis.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
