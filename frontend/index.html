<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telescope: explore GitHub organisations</title>
    <meta
      name="description"
      content="Browse, filter and sort the repositories of any GitHub organisation."
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before React mounts to avoid a flash of the wrong one.
      try {
        var t = localStorage.getItem('telescope-theme')
        if (t === 'light' || t === 'dark')
          document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
