[project]
name = "telescope"
version = "0.1.0"
description = "Telescope: explore a GitHub org's public repos"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "opentelemetry-instrumentation-logging==0.66b2",
    "python-json-logger>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telescope"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src/telescope"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-n auto -q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
